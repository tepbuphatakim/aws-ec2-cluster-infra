version: "3.8"

services:
  nginx:
    image: 015331741/aws-ec2-cluster-infra-app:v0.0.1-22609c1
    ports:
      - target: 5000
        published: 80
        protocol: tcp
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - nginx-network

networks:
  nginx-network:
    driver: overlay
